<!doctype html><html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZENO | إتمام الطلب</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800&family=Montserrat:wght@700;800;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0}body{background:#070707;color:#fff;font-family:Cairo;min-height:100vh}a{color:inherit;text-decoration:none}
.top{height:75px;border-bottom:1px solid #242424;display:flex;align-items:center;justify-content:space-between;padding:0 6%;background:#080808dd;backdrop-filter:blur(16px)}.logo{font:900 22px Montserrat;letter-spacing:5px}.back{color:#aaa}
main{max-width:1050px;margin:auto;padding:55px 20px}.title{margin-bottom:28px}.title small{color:#f33;font-weight:800;letter-spacing:2px}.title h1{font:900 42px Montserrat;margin-top:7px}
.card{display:grid;grid-template-columns:1fr 1fr;gap:42px;align-items:center;background:#0d0d0d;border:1px solid #252525;border-radius:42px 8px 42px 8px;padding:25px}.photo{height:560px;background:#eee;border-radius:65px 8px 8px 8px;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover}.details h2{font-size:27px;margin-bottom:12px}.price{font:900 28px Montserrat;color:#fff;margin-bottom:25px}.label{font-weight:800;margin-bottom:10px;display:block}.sizes{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:27px}.size{width:52px;height:44px;border:1px solid #444;border-radius:12px;background:#111;color:#fff;font-weight:800}.size.selected{background:#fff;color:#000;border-color:#fff}.order{width:100%;height:54px;border:0;border-radius:999px;background:#f51717;color:#fff;font-weight:900;font-size:16px;transition:.25s}.order:hover{background:#fff;color:#000}.hint{color:#777;font-size:12px;margin-top:13px;text-align:center}
.form{display:none;margin-top:25px;background:#0d0d0d;border:1px solid #252525;border-radius:30px;padding:25px}.form.show{display:block}.form h3{font-size:22px;margin-bottom:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}input,textarea{width:100%;background:#121212;color:#fff;border:1px solid #303030;border-radius:13px;padding:14px;outline:none;font:inherit}textarea{grid-column:1/-1;min-height:95px;resize:vertical}.submit{grid-column:1/-1;height:50px;border:0;border-radius:999px;background:#fff;color:#000;font-weight:900}
.success{display:none;text-align:center;padding:30px;color:#eee}.success.show{display:block}@media(max-width:750px){.card{grid-template-columns:1fr;padding:14px}.photo{height:390px}.title h1{font-size:31px}.grid{grid-template-columns:1fr}textarea,.submit{grid-column:auto}}
</style></head><body>
<header class="top"><a class="logo" href="index.html">ZENO</a><a class="back" href="index.html">← رجوع للمتجر</a></header>
<main><div class="title"><small>CHECKOUT</small><h1>اختار المقاس وكمل طلبك</h1></div>
<section class="card">
<div class="photo"><img id="pimg" alt="product"></div>
<div class="details"><h2 id="pname">ZENO</h2><div class="price" id="pprice">400 EGP</div>
<span class="label">المقاس</span><div class="sizes"><button class="size" data-size="S">S</button><button class="size selected" data-size="M">M</button><button class="size" data-size="L">L</button><button class="size" data-size="XL">XL</button><button class="size" data-size="XXL">XXL</button></div>
<button class="order" onclick="openForm()">متابعة للطلب</button><div class="hint">الدفع عند الاستلام • تأكيد الطلب من صفحة البيانات</div></div>
</section>
<section class="form" id="form"><h3>بيانات الاستلام</h3><div class="grid"><input id="name" placeholder="الاسم بالكامل"><input id="phone" placeholder="رقم الهاتف"><input id="city" placeholder="المحافظة / المدينة"><input id="address" placeholder="العنوان بالتفصيل"><textarea id="notes" placeholder="ملاحظات إضافية (اختياري)"></textarea><button class="submit" onclick="sendOrder()">تأكيد الطلب</button></div></section>
<div class="success" id="success">تم تسجيل طلبك مبدئيًا ✓<br><small>سيتم التواصل معك لتأكيد التفاصيل.</small></div>
</main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import {getFirestore,collection,addDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyAKqlRuchZWDkEEl5vtpmAC5hJWQRBpawU",authDomain:"zeno-store-ee3ef.firebaseapp.com",projectId:"zeno-store-ee3ef",storageBucket:"zeno-store-ee3ef.firebasestorage.app",messagingSenderId:"136187173794",appId:"1:136187173794:web:9f80dec9561bbd5b1cb0fb",measurementId:"G-GJT5QM7G03"};
const app=initializeApp(firebaseConfig),db=getFirestore(app);
const p=JSON.parse(localStorage.getItem('zenoBuy')||'null')||{name:'ZENO PRODUCT',price:400,img:''};
document.getElementById('pname').textContent=p.name||'ZENO PRODUCT';document.getElementById('pprice').textContent=Number(p.price||0).toLocaleString('en-US')+' EGP';document.getElementById('pimg').src=p.imageUrl||p.img||'';
let selected='M';document.querySelectorAll('.size').forEach(b=>b.onclick=()=>{document.querySelectorAll('.size').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');selected=b.dataset.size});
window.openForm=()=>{document.getElementById('form').classList.add('show');document.getElementById('form').scrollIntoView({behavior:'smooth',block:'center'})};
window.sendOrder=async()=>{
 const fields=['name','phone','city','address'];
 if(fields.some(id=>!document.getElementById(id).value.trim())){alert('من فضلك اكتب كل بيانات الاستلام المطلوبة');return}
 const btn=document.querySelector('.submit');btn.disabled=true;btn.textContent='جاري تسجيل الطلب...';
 const order={productId:p.id||'',productName:p.name||'ZENO PRODUCT',productPrice:Number(p.price||0),productImageUrl:p.imageUrl||p.img||'',size:selected,customerName:document.getElementById('name').value.trim(),phone:document.getElementById('phone').value.trim(),city:document.getElementById('city').value.trim(),address:document.getElementById('address').value.trim(),notes:document.getElementById('notes').value.trim(),status:'جديد',createdAt:serverTimestamp()};
 try{
  await addDoc(collection(db,'orders'),order);

  // إرسال الإشعار التلقائي لموبايلك فوراً عبر FCM API
  fetch('https://fcm.googleapis.com/fcm/send', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'key=BKZ5dJsYr31iWOMYL7TkCboqDHL2m4qeBA3rA0FnVNK5Af0ncBSrfypzKmGIdll7TJmv-BRKta6wrpMoA9mhrQw'
    },
    body: JSON.stringify({
      "to": "DcNmy-zkuICUQXWggUtHkj:APA91bGCm-qBT6ZYlm0GkfTb96dI-ePC-04t4iDN7pworwt1ainjNelj_C5Psw2Q8VoX5P1I5iBx_7Ws3cFfRg8uvYg0wRgFwiDgVThcs6OxUzogseVAeZQ",
      "notification": {
        "title": "📦 طلب جديد في ZENO Store!",
        "body": `طلب جديد من ${order.customerName} بقيمة ${order.productPrice} ج.م`,
        "icon": "https://cdn-icons-png.flaticon.com/512/3119/3119338.png",
        "click_action": "https://abdelrhman14820109-dev.github.io/ZENO/"
      }
    })
  }).catch(e=>console.error("فشل إرسال الإشعار:", e));

  localStorage.setItem('zenoLastOrder',JSON.stringify(order));
  localStorage.removeItem('zenoBuy');
  document.getElementById('form').style.display='none';
  document.getElementById('success').classList.add('show');
 }catch(e){console.error(e);alert('حصل خطأ أثناء تسجيل الطلب: '+e.message)}finally{btn.disabled=false;btn.textContent='تأكيد الطلب'}
};
</script></body></html>
