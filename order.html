<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZENO Store - تأكيد الطلب</title>
  <style>
    :root {
      --bg: #0d0f12;
      --card-bg: #161920;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --text: #f8fafc;
      --text-sub: #94a3b8;
      --border: #262b36;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      font-size: 1.5rem;
      color: var(--text);
    }

    .product-summary {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 12px;
      margin-bottom: 20px;
      border: 1px solid var(--border);
    }

    .product-summary img {
      width: 70px;
      height: 70px;
      object-fit: cover;
      border-radius: 8px;
    }

    .product-info h3 {
      font-size: 1.1rem;
      margin-bottom: 4px;
    }

    .product-info p {
      color: var(--accent);
      font-weight: bold;
      font-size: 1rem;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.9rem;
      color: var(--text-sub);
    }

    input, textarea, select {
      width: 100%;
      padding: 12px;
      background: #0f1117;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, textarea:focus, select:focus {
      border-color: var(--accent);
    }

    .sizes {
      display: flex;
      gap: 8px;
      margin-top: 6px;
    }

    .size-btn {
      flex: 1;
      padding: 10px;
      background: #0f1117;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
      transition: 0.2s;
    }

    .size-btn.active {
      background: var(--accent);
      border-color: var(--accent);
    }

    .submit {
      width: 100%;
      padding: 14px;
      background-color: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s;
    }

    .submit:hover {
      background-color: var(--accent-hover);
    }

    .submit:disabled {
      background-color: #475569;
      cursor: not-allowed;
    }

    #success {
      display: none;
      text-align: center;
      padding: 20px 0;
    }

    #success.show {
      display: block;
    }

    #success h3 {
      color: var(--success);
      font-size: 1.4rem;
      margin-bottom: 10px;
    }

    #success p {
      color: var(--text-sub);
      line-height: 1.6;
    }
  </style>
</head>
<body>

<div class="container">
  <div id="form">
    <h2>تأكيد طلب الشراء</h2>
    
    <div class="product-summary">
      <img id="p-img" src="" alt="صورة المنتج">
      <div class="product-info">
        <h3 id="p-name">اسم المنتج</h3>
        <p id="p-price">0 EGP</p>
      </div>
    </div>

    <div class="form-group" id="size-group">
      <label>اختر المقاس:</label>
      <div class="sizes">
        <div class="size-btn active" onclick="selectSize(this, 'M')">M</div>
        <div class="size-btn" onclick="selectSize(this, 'L')">L</div>
        <div class="size-btn" onclick="selectSize(this, 'XL')">XL</div>
        <div class="size-btn" onclick="selectSize(this, '2XL')">2XL</div>
      </div>
    </div>

    <div class="form-group">
      <label>الاسم بالكامل *</label>
      <input type="text" id="name" placeholder="اكتب اسمك الثلاثي">
    </div>

    <div class="form-group">
      <label>رقم الهاتف *</label>
      <input type="tel" id="phone" placeholder="01xxxxxxxxx">
    </div>

    <div class="form-group">
      <label>المحافظة / المدينة *</label>
      <input type="text" id="city" placeholder="مثال: القاهرة / نصر">
    </div>

    <div class="form-group">
      <label>العنوان بالتفصيل *</label>
      <input type="text" id="address" placeholder="اسم الشارع، رقم العمارة، الشقة">
    </div>

    <div class="form-group">
      <label>ملاحظات إضافية (اختياري)</label>
      <textarea id="notes" rows="2" placeholder="أي تفاصيل أخرى تخص الشحن"></textarea>
    </div>

    <button class="submit" onclick="sendOrder()">تأكيد الطلب الآن</button>
  </div>

  <div id="success">
    <h3>🎉 تم إرسال طلبك بنجاح!</h3>
    <p>شكراً لطلبك من <strong>ZENO Store</strong>.<br>سيتواصل معك فريق المبيعات قريباً لتأكيد الشحن.</p>
  </div>
</div>

<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  // إعدادات Firebase الخاصة بمشروعك ZENO Store
  const firebaseConfig = {
    projectId: "zeno-store-ee3ef"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // جلب بيانات المنتج المختار من الـ LocalStorage
  let p = JSON.parse(localStorage.getItem('zenoBuy') || '{}');
  let selectedSize = 'M';

  document.getElementById('p-name').textContent = p.name || 'منتج ZENO Store';
  document.getElementById('p-price').textContent = (p.price || 0) + ' EGP';
  document.getElementById('p-img').src = p.imageUrl || p.img || 'https://via.placeholder.com/150';

  window.selectSize = (el, size) => {
    document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
    selectedSize = size;
  };

  window.sendOrder = async () => {
    const fields = ['name', 'phone', 'city', 'address'];
    if (fields.some(id => !document.getElementById(id).value.trim())) {
      alert('من فضلك اكتب كل بيانات الاستلام المطلوبة');
      return;
    }

    const btn = document.querySelector('.submit');
    btn.disabled = true;
    btn.textContent = 'جاري تسجيل الطلب...';

    const customerName = document.getElementById('name').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const city = document.getElementById('city').value.trim();
    const address = document.getElementById('address').value.trim();
    const notes = document.getElementById('notes').value.trim();

    const order = {
      productId: p.id || '',
      productName: p.name || 'ZENO PRODUCT',
      productPrice: Number(p.price || 0),
      productImageUrl: p.imageUrl || p.img || '',
      size: selectedSize,
      customerName,
      phone,
      city,
      address,
      notes,
      status: 'جديد',
      createdAt: serverTimestamp()
    };

    try {
      // 1. حفظ الطلب في قواعد البيانات Firestore
      await addDoc(collection(db, 'orders'), order);

      // 2. إرسال الإشعار المباشر فوراً لموبايلك عبر تطبيق ntfy
      const ntfyTopic = "zeno_store_9988";

      fetch(`https://ntfy.sh/${ntfyTopic}`, {
        method: 'POST',
        headers: {
          'Title': '📦 طلب جديد في ZENO Store!',
          'Priority': 'high',
          'Tags': 'shopping_bags'
        },
        body: `👤 العميل: ${customerName}\n📞 الهاتف: ${phone}\n🛍️ المنتج: ${order.productName} (${selectedSize})\n💰 السعر: ${order.productPrice} EGP\n📍 العنوان: ${city} - ${address}`
      }).catch(err => console.error("ntfy Error:", err));

      localStorage.setItem('zenoLastOrder', JSON.stringify(order));
      localStorage.removeItem('zenoBuy');
      document.getElementById('form').style.display = 'none';
      document.getElementById('success').classList.add('show');
    } catch (e) {
      console.error(e);
      alert('حصل خطأ أثناء تسجيل الطلب: ' + e.message);
    } finally {
      btn.disabled = false;
      btn.textContent = 'تأكيد الطلب';
    }
  };
</script>

</body>
</html>
